[pytest]
# WHY THIS FILE EXISTS
# An infinite loop inside a test used to hang the entire test run with no output at all,
# which looked like a broken runner rather than a bug in the code (it was an unbounded
# "draw distinct guesses" loop in dataset.py).
#
# pytest-timeout turns any such hang into an ordinary test FAILURE, with a traceback
# pointing at the exact line that stopped making progress. A hang can no longer be silent.
#
# 20s is ~80x the whole suite's normal runtime (0.24s), so it only ever fires on a real hang.
timeout = 20
timeout_method = signal
